{{/*
  Text block content block: a heading over one to three columns of markdown.

  The per-instance <style> block this component used to emit has moved to
  assets/scss/components/text-block.scss; the values that varied per instance
  arrive as custom properties on the section instead. Unscoped rules in an
  inline <style> collide when the component renders more than once, and they
  re-render badly in the editor.
*/}}
<section
  class="text-block"
  style="
    --text-block-bg: {{ .background_color }};
    --text-block-columns: {{ .text_column_count }};
    --text-block-align: {{ .text_alignment }};
    --text-block-color: {{ .text_color }};
    --text-block-item-margin-inline: {{ if eq .text_alignment "center" }}auto{{ else }}0{{ end }};">
  <div class="markdown-text text-block-container">
    <h2
      style="color: {{ .heading.text_color }}; text-align: {{ .heading.text_alignment }};"
      data-editable="text"
      data-prop="heading.heading_text"
      data-type="span">
      {{ .heading.heading_text }}
    </h2>
    <div
      class="text-block-body-content"
      data-editable="text"
      data-prop="text_content"
      data-type="block">
      {{ .text_content | markdownify }}
    </div>
  </div>
</section>
