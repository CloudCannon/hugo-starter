{{/*
  Primary button. Single root element, so it drops straight into the
  array-item wrapper the buttons array renders around it.
  hover_brightness used to be an inline <style> block with an unscoped
  selector; it is a custom property now so instances don't collide.
*/}}
<a
  class="primary-button"
  href="{{ .button_link }}"
  {{ with .button_aria_label }}aria-label="{{ . }}"{{ end }}
  style="color: {{ .text_color }}; background-color: {{ .background_color }}; border: 2px solid {{ .background_color }}; --hover-brightness: {{ .hover_brightness }};">
  <p>
    {{ with .button_icon }}
      <span class="button__icon"><i class="{{ . }}"></i></span>
    {{ end }}
    <span data-editable="text" data-prop="button_text" data-type="span">{{ .button_text }}</span>
  </p>
</a>
