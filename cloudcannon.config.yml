timezone: Etc/UTC

source_editor:
  tab_size: 2
  theme: sublime
  show_gutter: true

paths:
  static: static
  uploads: static/images

commit_templates:
  - label: Default message
    template_string: '[default_commit_message]'
  - label: Custom message
    template_string: '{message}'

collections_config:
  pages:
    path: content
    icon: laptop_mac
    url: '/[full_slug]/'
    glob:
      - '**/*.md'
      - '!blog/*'
    _enabled_editors:
      - visual
    new_preview_url: /
    schemas:
      default:
        path: '.cloudcannon/schemas/page.md'
    create:
      path: '[relative_base_path]/{filename|slugify|lowercase}.md'
  blog:
    icon: newspaper
    path: content/blog
    url: '/blog/[full_slug]/'
    schemas:
      default:
        path: '.cloudcannon/schemas/post.md'
      paginated:
        path: '.cloudcannon/schemas/paginated-page.md'
    create:
      path: '[relative_base_path]/{filename|slugify|lowercase}.md'
    add_options:
      - name: Add Post
        editor: content
        schema: default
    _enabled_editors:
      - visual
      - content
    _inputs:
      thumb_image:
        options:
          preview:
            image: 
              - key: image_path
            text:
              - key: alt_text
              - Thumbnail Image
            subtext:
              - key: image_path
              - Update Image Path and Alt Text
      featured_image:
        options:
          preview:
            image: 
              - key: image_path
            text:
              - key: alt_text
              - Hero Image
            subtext:
              - key: image_path
              - Update Image Path and Alt Text
  data:
    path: data
    disable_url: true
    glob:
      - '!icons.yml'
    icon: analytics
    _inputs:
      value:
        type: color

collection_groups:
  - heading: Pages
    collections:
      - pages
      - blog
  - heading: Data
    collections:
      - data

data_config:
  colors:
    path: data/colors.yml
  # Required for the @data[nav] selectors in the header and footer partials.
  # Without this entry those editable regions cannot resolve.
  nav:
    path: data/nav.yml
  tags:
    path: data/tags.yml
  icons:
    path: data/icons.yml
  seo:
    path: data/seo.yml

file_config:
  - glob: data/colors.yml
    _structures:
      color:
        values:
          - value:
              name:
              value:
            preview:
              icon: palette
              icon_color:
                - key: value
    _inputs:
      $:
        type: array
        label: Colors
        comment: Set the colors available in the color selectors throughout the site.
        options:
          structures: _structures.color
      value:
        type: color
      name:
        type: text
        comment: What is seen in the color selector dropdown.
  - glob: data/tags.yml
    _inputs:
      $:
        type: array
        label: Tags
        comment: Set the tags available in posts.
      $[*]:
        type: text
  - glob: data/nav.yml
    _inputs:
      header:
        type: object
        options:
          preview:
            icon: menu
            text: Header details
            subtext: Update logo, colors, and links.
      footer:
        type: object
        options:
          preview:
            icon: menu
            text: Footer details
            subtext: Update logo, colors, socials, copyright, and links.
      social:
        type: array
        options:
          structures: _structures.social_links
    _structures:
      social_links:
        values:
          - value:
              icon:
              link:
              name:
            _inputs:
              name:
                type: text
                comment: Adds an aria-label for assistive technologies
  - glob: data/seo.yml
    _inputs:
      header:
        type: object
        options:
          preview:
            icon: menu
            text: Header details
            subtext: Update logo, colors, and links.
      footer:
        type: object
        options:
          preview:
            icon: menu
            text: Footer details
            subtext: Update logo, colors, socials, copyright, and links.
      default_author:
        comment: Used as author for blog posts that don't have an author defined on the page.

_editables:
  # Toolbar for data-type="text" regions: paragraph-level rich text.
  text:
    bold: true
    italic: true
    strike: true
    subscript: true
    superscript: true
    underline: true
    link: true
    removeformat: true
    copyformatting: true
    undo: true
    redo: true
  # Toolbar for data-type="block" regions: multi-paragraph rich text. Mirrors
  # the _inputs.text_content markdown input, since those are the same values.
  block:
    blockquote: true
    bold: true
    format: p
    italic: true
    strike: true
    subscript: true
    superscript: true
    underline: true
    link: true
    bulletedlist: true
    indent: true
    numberedlist: true
    outdent: true
    undo: true
    redo: true
    removeformat: true
    copyformatting: true
  content:
    blockquote: true
    bold: true
    format: p h2 h3 h4
    italic: true
    strike: true
    subscript: true
    superscript: true
    underline: true
    link: true
    bulletedlist: true
    indent: true
    numberedlist: true
    outdent: true
    code: true
    embed: true
    horizontalrule: true
    image: true
    table: true
    undo: true
    redo: true
    removeformat: true
    copyformatting: true
    image_size_attributes: true
    snippet: true

# Structures for the page builder and its nested button arrays.
#
# Each value here describes one content block: the label, icon and tags the
# editor sees when adding a block, the default value written into front matter,
# and the inputs for editing it in the sidebar.
#
# id_key tells CloudCannon which key in each value identifies the structure
# option. It is the same key the page builder dispatches on in
# layouts/_default/list.html (data-component-key="_name"), so a block's _name
# both picks the structure and names the partial that renders it.
_structures:
  content_blocks:
    id_key: _name
    style: modal
    values:
      - label: Hero
        description: Heading, text, image & colored buttons.
        icon: cottage
        tags:
          - Heading
          - Text
          - Image
          - Buttons
        value:
          _name: hero
          background_color: '#ffffff'
          heading:
            heading_text:
            text_color: '#333232'
            heading_gradient_color: '#A0A2FF'
          subheading:
            text_content:
            text_color: '#333232'
          image:
            image_path:
            alt_text:
          buttons: []
        _inputs:
          heading:
            type: object
            options:
              preview:
                icon: short_text
                text:
                  - key: heading_text
                  - Heading
                subtext:
                  - 'Update heading text and color'
          subheading:
            type: object
            options:
              preview:
                icon: description
          heading_gradient_color:
            type: select
            options:
              values: data.colors
              value_key: value
              preview:
                text:
                  - key: name
                icon: palette
                icon_color:
                  - key: value
          image:
            type: object
            options:
              preview:
                icon: image
                text:
                  - key: alt_text
                  - 'Image'
                subtext:
                  - key: image_path
                  - 'Update image'
                image:
                  - key: image_path
          buttons:
            type: array
            options:
              structures: _structures.buttons
              empty_type: array

      - label: Hero - Video Background
        description: Text over video bg
        icon: duo
        tags:
          - Heading
          - Video
          - Buttons
        value:
          _name: hero-video
          heading:
            heading_text:
            text_color: '#ffffff'
          subheading:
            text_content:
            text_color: '#ffffff'
          video:
            video_path: /videos/nz-coast.mp4
            poster_image: /images/nz-coast-poster.jpg
            playback_speed: 0.5
          header_style_overrides:
            background_color: transparent
            text_color: '#ffffff'
            hover_text_color: '#F2F2F2'
            alternate_logo:
              image_path:
              logo_alt_text:
          background_filters:
            brightness: 0.5
            blur: 1
          buttons: []
        _inputs:
          heading:
            type: object
            options:
              preview:
                icon: short_text
                text:
                  - key: heading_text
                  - Heading
                subtext:
                  - 'Update heading text and color'
          subheading:
            type: object
            options:
              preview:
                icon: description
          video:
            type: object
            options:
              preview:
                icon: duo
                text:
                  - 'Background Video'
                subtext:
                  - key: video_path
                  - 'Select a video'
          video_path:
            type: file
            options:
              paths:
                static: static
                uploads: 'static/videos'
          poster_image:
            type: image
            comment: Specifies an image to be shown while the video is downloading. No processing is supported on video posters, so it's particularly important to ensure this file not be too large when uploading.
          playback_speed:
            type: range
            comment: Specify a playback speed for the background video.
            options:
              min: 0.1
              max: 1.5
              step: 0.1
          header_style_overrides:
            type: object
            comment: Specify header styles for just this page if set. Will not take effect until the next time the page is saved.
            options:
              preview:
                icon: palette
          hover_text_color:
            type: select
            comment: Updates the header hover text color for this page if set.
            options:
              values: data.colors
              value_key: value
              preview:
                text:
                  - key: name
                icon: palette
                icon_color:
                  - key: value
          alternate_logo:
            type: object
            comment: Set a different logo in the header if needed with this component.
            options:
              preview:
                icon: palette
          background_filters:
            type: object
            comment: Set brightness and blur filters over the background video to make the text content more legible.
            options:
              preview:
                icon: exposure
          brightness:
            type: range
            options:
              min: 0
              max: 2
              step: 0.025
          blur:
            type: range
            options:
              min: 0
              max: 10
              step: 0.25
          buttons:
            type: array
            options:
              structures: _structures.buttons
              empty_type: array

      - label: Left-Right
        description: Text next to image
        icon: chrome_reader_mode
        tags:
          - Image
          - Text
          - Button
        value:
          _name: left-right
          background_color: '#ffffff'
          flipped: true
          heading:
            heading_text:
            text_color: '#333232'
          text:
            text_content:
            text_color: '#333232'
          image:
            image_path:
            alt_text:
          button:
        _inputs:
          flipped:
            type: switch
          heading:
            type: object
            options:
              preview:
                icon: short_text
                text:
                  - key: heading_text
                  - Heading
                subtext:
                  - Update heading text and color
          text:
            type: object
            options:
              preview:
                icon: description
          image:
            type: object
            options:
              preview:
                icon: image
                text:
                  - key: alt_text
                  - 'Image'
                subtext:
                  - key: image_path
                  - 'Update image'
                image:
                  - key: image_path
          button:
            type: object
            options:
              structures: _structures.buttons

      - label: Text Block
        description: Simple text block
        icon: description
        tags:
          - Text
          - Colors
        value:
          _name: text-block
          background_color: '#ffffff'
          heading:
            heading_text: A section heading
            text_alignment: center
            text_color: '#034adf'
          text_color: '#333232'
          text_column_count: 2
          text_alignment: start
          text_content:
        _inputs:
          heading:
            type: object
            options:
              preview:
                icon: short_text
                text:
                  - key: heading_text
                  - Heading
          text_alignment:
            type: select
            options:
              values:
                - start
                - center
                - end
          text_column_count:
            type: range
            options:
              min: 1
              max: 3
              step: 1

  buttons:
    id_key: _name
    values:
      - label: Primary Button
        description: Solid bg color
        icon: buttons_alt
        tags:
          - Solid background
        value:
          _name: button-primary
          button_text:
          button_icon:
          button_link:
          button_aria_label:
          background_color: '#034AD8'
          hover_brightness: 0.85
          text_color: '#ffffff'
        _inputs:
          button_text:
            options:
              preview:
                text:
                  - key: button_text
                  - Button

      - label: Secondary Button
        description: Outline & transparent bg
        icon: buttons_alt
        tags:
          - Outline
          - Transparent background
        value:
          _name: button-secondary
          button_text:
          button_icon:
          button_link:
          button_aria_label:
          background_color: '#034AD8'
          hover_brightness: 0.85
          text_color: '#ffffff'
        _inputs:
          button_text:
            options:
              preview:
                text:
                  - key: button_text
                  - Button


_inputs:
  content_blocks:
    type: array
    options:
      structures: _structures.content_blocks
      empty_type: array
  text_content:
    type: markdown
    options:
      blockquote: true
      bold: true
      format: p
      italic: true
      strike: true
      subscript: true
      superscript: true
      underline: true
      link: true
      bulletedlist: true
      indent: true
      numberedlist: true
      outdent: true
      undo: true
      redo: true
      removeformat: true
      copyformatting: true
  tags:
    type: multiselect
    comment: To add a new tag, go to the [tags data file](cloudcannon:collections/data/tags.yml).
    options:
      values: data.tags
      empty_type: array
  background_color:
    type: select
    options:
      values: data.colors
      value_key: value
      preview:
        text:
          - key: name
        icon: palette
        icon_color: 
          - key: value
  text_color:
    type: select
    options:
      values: data.colors
      value_key: value
      preview:
        text:
          - key: name
        icon: palette
        icon_color: 
          - key: value
  text_hover_color:
    type: select
    options:
      values: data.colors
      value_key: value
      preview:
        text:
          - key: name
        icon: palette
        icon_color: 
          - key: value
  color:
    type: select
    options:
      values: data.colors
      value_key: value
      preview:
        text:
          - key: name
        icon: palette
        icon_color: 
          - key: value
  icon:
    type: select
    options:
      values: data.icons
      value_key: icon_code
      preview:
        text:
          - key: name
  button_icon:
    type: select
    options:
      values: data.icons
      value_key: icon_code
      preview:
        text:
          - key: name
  button_link:
    type: url
  button_aria_label:
    type: text
    comment: >-
      Add a description if the button text content is generic, eg. 'Read more', or if the button contains no text at all.
  hover_brightness:
    type: range
    options:
      min: 0
      max: 1.5
      step: 0.05
  seo:
    type: object
    options:
      preview:
        icon: query_stats
        text:
          - 'Search engine optimization'
        subtext:
          - key: page_description
          - 'Update SEO values for the page'
  layout:
    hidden: true
  date:
    instance_value: NOW
  page_size:
    type: number
    comment: The number of collection items to list per page
  draft:
    type: switch
  social:
    type: object
    options:
      preview:
        icon: link
  links[*]:
    type: object
    options:
      preview:
        icon: link
        text:
          - key: text
          - 'Link'
        subtext:
          - key: link
          - 'Add a social link'
  social_icon:
    type: select
    options:
      values: data.icons
  social[*]:
    type: object
    options:
      preview:
        icon: query_stats
  logo:
    type: image
  logo_url:
    comment: Link for the logo in the top left of the footer
  copyright:
    comment: Automatically prefixed with the current year
  page_description:
    comment: Defaults to the description set in the Site SEO data file
  canonical_url:
    comment: Defaults to the pages url
  featured_image:
    comment: Defaults to the image set in the Site SEO data file
  open_graph_type:
    type: select
    options:
      values:
        - website
        - article
    comment: Defaults to the type 'website'
  no_index:
    type: checkbox
    comment:
      When selected this removes the page from your sitemap and adds the noindex
      robots meta tag

_snippets_imports:
  hugo:
    include:
      - hugo_figure
      - hugo_vimeo
      - hugo_youtube

_snippets:
  alert:
    template: hugo_shortcode_named_args
    inline: false
    preview:
      icon: announcement
      text: Alert
      subtext:
        - key: alert_message
        - Update alert content and styles
    definitions:
      shortcode_name: alert
      named_args:
        - editor_key: background_color
          source_key: background_color
          type: string
        - editor_key: alert_message
          source_key: alert_message
          type: string
        - editor_key: color
          source_key: color
          type: string
        - editor_key: icon
          source_key: icon
          type: string
    _inputs:
      background_color:
        type: select
        comment: Test this config works
        options:
          values: data.colors
          value_key: value
          preview:
            text:
              - key: name
            icon: palette
            icon_color: 
              - key: value
      icon:
        type: select
        options:
          values: data.icons
          value_key: icon_code
          preview:
            text:
              - key: name
      color:
        type: select
        options:
          values: data.colors
          value_key: value
          preview:
            text:
              - key: name
            icon: palette
            icon_color: 
              - key: value
      alert_message:
        comment: The text displayed in the alert.
        type: textarea
  accordion:
    template: hugo_paired_shortcode_named_args
    inline: false
    preview:
      text:
        - key: summary 
        - Accordion
      subtext:
        - key: inner_text
      icon: info
    definitions:
      shortcode_name: accordion
      content_key: inner_text
      positional_args:
        - editor_key: summary
          type: string
    _inputs:
      summary:
        type: text
      inner_text:
        type: markdown
        options:
          blockquote: true
          bold: true
          format: p
          italic: true
          strike: true
          subscript: true
          superscript: true
          underline: true
          link: true
          bulletedlist: true
          indent: true
          numberedlist: true
          outdent: true
          undo: true
          redo: true
          removeformat: true
          copyformatting: true