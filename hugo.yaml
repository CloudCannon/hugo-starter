baseURL: 'https://adjective-noun.cloudvent.net/'
languageCode: en-us
title: Hugo Editable Regions Starter
module:
  imports:
    - path: github.com/CloudCannon/editable-regions
  mounts:
    - source: assets
      target: assets
    - source: static
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
params:
  editable_regions:
    verbose: false
build:
  buildStats:
    enable: true
  cachebusters:
  - source: assets/notwatching/hugo_stats\.json
    target: css
  - source: (postcss|tailwind)\.config\.js
    target: css
markup:
  goldmark:
    renderer:
      hardWraps: true
      unsafe: true
